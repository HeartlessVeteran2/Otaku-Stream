lifecycleRuntimeKtx = "2.8.7"
activityCompose = "1.9.3"
composeBom = "2024.12.01"
hilt = "2.53"
hiltNavigationCompose = "1.2.0"
navigationCompose = "2.8.5"
media3 = "1.5.0"
room = "2.8.4"
rhino = "1.7.15"
quickjs = "3.2.3"
libtorrent4j = "2.1.0-39"
jsoup = "1.18.1"
coroutines = "1.8.1"
okhttp = "4.12.0"
coil = "2.7.0"
securityCrypto = "1.1.0-alpha06"
junit = "4.13.2"
json = "20240303"
